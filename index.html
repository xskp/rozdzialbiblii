<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Losuj rozdział Biblii</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <div class="cross">✝</div>

            <p class="subtitle">BIBLIA WUJKA</p>

            <h1>Losuj rozdział</h1>

            <p class="description">
                Wybierz część Biblii i pozwól losowi wybrać dla Ciebie rozdział.
            </p>
        </header>


        <section class="card">

            <p class="label">WYBIERZ ZAKRES</p>

            <div class="choices">

                <button class="choice active" data-testament="ALL">
                    Cała Biblia
                </button>

                <button class="choice" data-testament="ST">
                    Stary Testament
                </button>

                <button class="choice" data-testament="NT">
                    Nowy Testament
                </button>

            </div>


            <div class="display">

                <p id="status">
                    GOTOWY?
                </p>

                <div id="chapter">
                    Wybierz START
                </div>

            </div>


            <div class="buttons">

                <button id="start">
                    START
                </button>

                <button id="stop" disabled>
                    STOP
                </button>

            </div>


            <div id="result" class="result hidden">

                <p>WYLOSOWANO</p>

                <h2 id="resultName"></h2>

                <p class="small">
                    W następnym kroku dodamy tutaj pełny tekst rozdziału.
                </p>

            </div>

        </section>


        <footer>
            Biblia Wujka • Projekt darmowy
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
